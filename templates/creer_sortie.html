{% extends "base.html" %}

{% block titre %}Créer une sortie - Wanderly{% endblock %}

{% block contenu %}
<div class="container my-5" style="max-width: 640px;">
  <h1 class="h3 wander-text mb-4">Créer une sortie</h1>

  {% if erreur %}
  <div class="alert-wander mb-3">{{ erreur }}</div>
  {% endif %}

  <form method="post">
    <div class="mb-3">
      <label for="titre" class="form-label">Titre *</label>
      <input type="text" class="form-control" id="titre" name="titre"
             placeholder="Ex : Journée détente à Hammamet" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" name="description" rows="3"></textarea>
    </div>

    <div class="mb-3">
      <label for="duree" class="form-label">Durée</label>
      <input type="text" class="form-control" id="duree" name="duree"
             placeholder="Ex : 2 heures, une journée">
    </div>

    <div class="mb-3">
      <label class="form-label">Fourchette de budget par personne (DT) *</label>
      <div class="row g-2">
        <div class="col-6">
          <input type="number" class="form-control" id="prix_min" name="prix_min"
                 min="0" step="0.5" value="0" placeholder="Minimum" required>
        </div>
        <div class="col-6">
          <input type="number" class="form-control" id="prix_max" name="prix_max"
                 min="0" step="0.5" value="0" placeholder="Maximum" required>
        </div>
      </div>
      <div class="form-text">Exemple : 10 et 20. Mets 0 et 0 si la sortie est gratuite, ou le même nombre deux fois si le budget est fixe.</div>
    </div>

    <div class="row g-3 mb-4">
      <div class="col-md-6">
        <label for="saison" class="form-label">Saison idéale</label>
        <select class="form-select" id="saison" name="saison">
          <option value="">Pas de préférence</option>
          {% for s in saisons %}
          <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="col-md-6">
        <label for="taille_groupe" class="form-label">Taille du groupe</label>
        <input type="number" class="form-control" id="taille_groupe" name="taille_groupe"
               min="1" placeholder="Nombre de personnes">
      </div>
    </div>

    <button type="submit" class="btn btn-wander w-100">Créer la sortie</button>
  </form>
</div>
{% endblock %}
