<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titre %}Wanderly{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

  <nav class="navbar bg-white border-bottom">
    <div class="container">
      <a class="navbar-brand fw-bold wander-text" href="{{ url_for('accueil') }}">Wanderly</a>
      <div>
  {% if g.utilisateur %}
    <span class="me-2">Bonjour, <strong class="wander-text">{{ g.utilisateur.pseudo }}</strong></span>
    <a class="btn btn-wander" href="{{ url_for('deconnexion') }}">Déconnexion</a>
  {% else %}
    <a class="btn btn-link" href="{{ url_for('connexion') }}">Connexion</a>
    <a class="btn btn-wander" href="{{ url_for('inscription') }}">S'inscrire</a>
  {% endif %}
</div>
    </div>
  </nav>

  <main>
    {% block contenu %}{% endblock %}
  </main>

</body>
</html>
